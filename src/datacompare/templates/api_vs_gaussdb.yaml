name: API 与数据库核对
description: 核对 API 返回的订单与 DB 中订单表

sources:
  left:
    type: api
    connection: order_service
    method: GET
    url: /v1/orders
    params:
      month: "{{param.month}}"
      status: paid
    pagination:
      type: page
      page_param: pageNum
      size_param: pageSize
      size: 200
      total_path: $.data.total
    data_path: $.data.list[*]
    timeout: 30
    retry:
      max_attempts: 3
      backoff: 1.5
  right:
    type: gaussdb
    connection: prod_dws
    query: SELECT order_id, amount FROM dws.orders WHERE month = '{{param.month}}'

match:
  keys:
    - left: id
      right: order_id
    # Optional: normalize the key with a regex fullmatch before joining.
    # Both left_regex and right_regex are optional and default to no transformation.
    # Pattern must fullmatch and have 0 or 1 capture group; group 1 wins if present.
    # Example:
    #   - left: order_no
    #     right: order_id
    #     left_regex: 'ORD-\d{4}-0*(\d+)'   # extracts "123" from "ORD-2026-000123"

compare:
  fields:
    - left: amount
      right: amount
      mode: numeric
      decimal_places: 2

output:
  dir: ./reports/{{param.month}}
  formats: [html, json]

runtime:
  engine: auto
