name: Excel 与 API 核对

sources:
  left:
    type: excel
    path: ./expected.xlsx
  right:
    type: api
    connection: order_service
    url: /v1/orders
    pagination:
      type: offset
      offset_param: offset
      size_param: limit
      size: 200
    data_path: $.data.list[*]

match:
  keys:
    - left: 订单号
      right: order_id
    # Optional: normalize the key with a regex fullmatch before joining.
    # Both left_regex and right_regex are optional and default to no transformation.
    # Pattern must fullmatch and have 0 or 1 capture group; group 1 wins if present.
    # Example:
    #   - left: order_no
    #     right: order_id
    #     left_regex: 'ORD-\d{4}-0*(\d+)'   # extracts "123" from "ORD-2026-000123"

compare:
  fields:
    - left: 金额
      right: amount
      mode: numeric
      decimal_places: 2

output:
  dir: ./reports
  formats: [html, json]
