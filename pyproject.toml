[project]
name = "datacompare"
version = "0.1.0"
description = "CLI tool to compare Excel/GaussDB/API data sources"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=0.10",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "XlsxWriter>=3.2",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "jsonpath-ng>=1.6",
    "Jinja2>=3.1",
    "structlog>=24.1",
    "rich>=13.7",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "keyring>=25.0",
]

[project.scripts]
datacompare = "datacompare.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "testcontainers>=4.0",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacompare"]

[tool.hatch.build.targets.wheel.force-include]
"src/datacompare/reporters/templates" = "datacompare/reporters/templates"
"src/datacompare/templates" = "datacompare/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
